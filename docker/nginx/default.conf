server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php;

    # Docker 內建 DNS，讓 nginx 在請求時才解析 hostname，避免啟動順序問題
    resolver 127.0.0.11 valid=30s;

    # GeoServer WMS proxy
    location /geoserver/ {
        set $geoserver_upstream geoserver:8080;
        proxy_pass http://$geoserver_upstream;
        proxy_set_header Host $geoserver_upstream;

        set $cors_origin '';
        if ($http_origin ~* '^https://taipei-urban\.vividstudio\.net$') {
            set $cors_origin $http_origin;
        }
        if ($http_origin ~* '^http://localhost(:[0-9]+)?$') {
            set $cors_origin $http_origin;
        }

        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        set $app_upstream app:9000;
        fastcgi_pass $app_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}