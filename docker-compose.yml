services:
  db:
    image: postgis/postgis:15-3.4
    container_name: taipei_urban_db
    environment:
      POSTGRES_DB: taipei_urban
      POSTGRES_USER: urban
      POSTGRES_PASSWORD: urban1234
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  geoserver:
    image: docker.osgeo.org/geoserver:2.25.x
    container_name: taipei_urban_geoserver
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
    ports:
      - "8090:8080"
    volumes:
      - geoserver_data:/opt/geoserver_data
    depends_on:
      - db

volumes:
  pgdata:
  geoserver_data:
