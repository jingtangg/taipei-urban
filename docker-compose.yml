services:
  nginx:
    image: nginx:alpine
    container_name: taipei_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - taipei_network
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: taipei_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - taipei_network
    depends_on:
      - db

  db:
    image: postgis/postgis:15-3.4
    container_name: taipei_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: taipei_urban
      POSTGRES_USER: urban
      POSTGRES_PASSWORD: urban1234
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - taipei_network

  geoserver:
    image: docker.osgeo.org/geoserver:2.25.x
    container_name: taipei_geoserver
    restart: unless-stopped
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
    volumes:
      - geoserver_data:/opt/geoserver_data
    networks:
      - taipei_network
    depends_on:
      - db

networks:
  taipei_network:
    driver: bridge

volumes:
  pgdata:
  geoserver_data: